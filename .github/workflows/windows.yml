name: Windows CI
on:
  push:
    branches: [harbor]
  pull_request:
    branches: [harbor]
  workflow_dispatch:
    inputs:
      core-channel:
        description: 'Gopeed source channel (locked keeps go.mod)'
        type: choice
        options: [locked, preview, stable, main]
        default: locked
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: go.sum
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Follow Gopeed release
        if: github.event_name == 'workflow_dispatch' && inputs.core-channel != 'locked'
        shell: pwsh
        env:
          CORE_CHANNEL: ${{ inputs.core-channel }}
        run: ./scripts/update-core.ps1 -Channel $env:CORE_CHANNEL
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1 -Test
