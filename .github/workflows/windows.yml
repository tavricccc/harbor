name: Windows native build
on:
  push:
    branches: [winui-native]
  pull_request:
    branches: [winui-native]
  workflow_dispatch:
    inputs:
      core-channel:
        description: 'Gopeed release channel (locked keeps go.mod)'
        type: choice
        options: [locked, preview, stable]
        default: locked
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: core/go.sum
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Follow Gopeed release
        if: github.event_name == 'workflow_dispatch' && inputs.core-channel != 'locked'
        shell: pwsh
        env:
          CORE_CHANNEL: ${{ inputs.core-channel }}
        run: ./scripts/update-core.ps1 -Channel $env:CORE_CHANNEL
      - name: Build and verify
        shell: pwsh
        run: ./scripts/build.ps1 -Test
      - name: Package installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE) { throw 'Inno Setup installation failed' }
          $env:PATH += ';C:\Program Files (x86)\Inno Setup 6'
          ./scripts/package.ps1 -SkipBuild
          ./scripts/source.ps1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Harbor-windows-x64
          path: |
            artifacts/Harbor-Setup-*-x64.exe
            artifacts/Harbor-Source-*.zip
          compression-level: 0
